<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mesori · 3D Notifications</title>
  <style>
    :root {
      --gold: #c8963e;
      --gold-light: #e0c878;
      --text-primary: #f0e6d3;
      --text-secondary: #b8a88a;
      --card-bg: rgba(14, 18, 30, 0.8);
      --card-border: rgba(200, 150, 62, 0.35);
      --unread-dot: #ff6b35;
      --bg: #060a10;
      --card-width: clamp(180px, 45vw, 280px);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      font-family: 'Cinzel', Georgia, 'Times New Roman', serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
      overflow-x: hidden;
      padding: 16px;
    }

    /* شاشة التحميل */
    .loading-screen {
      position: fixed; inset: 0; z-index: 999;
      background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.5s;
    }
    .loading-screen.hidden { opacity: 0; pointer-events: none; }
    .loading-ring {
      width: 48px; height: 48px;
      border: 3px solid rgba(200,150,62,0.2); border-top-color: var(--gold); border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { margin-top: 16px; color: var(--gold-light); letter-spacing: 2px; font-size: 0.9rem; }

    /* وضع الاحتياطي (Fallback UI) */
    .fallback-container {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 600px;
      gap: 16px;
      padding: 20px;
    }
    .fallback-header {
      text-align: center;
      margin-bottom: 8px;
    }
    .fallback-header h1 {
      font-size: 1.8rem;
      letter-spacing: 3px;
      color: var(--gold-light);
      text-shadow: 0 0 20px rgba(200,150,62,0.5);
    }
    .fallback-header p {
      color: var(--text-secondary);
      font-size: 0.8rem;
      margin-top: 4px;
    }

    .notif-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .notif-card-fallback {
      background: rgba(14,18,30,0.85);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: 0 4px 25px rgba(0,0,0,0.5), 0 0 0 1px rgba(200,150,62,0.15) inset;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      gap: 8px;
      animation: fadeIn 0.4s ease backwards;
    }
    .notif-card-fallback:nth-child(1) { animation-delay: 0.05s; }
    .notif-card-fallback:nth-child(2) { animation-delay: 0.1s; }
    .notif-card-fallback:nth-child(3) { animation-delay: 0.15s; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } }

    .notif-card-fallback.unread {
      border-left: 4px solid var(--unread-dot);
      background: rgba(20, 24, 38, 0.9);
    }
    .notif-card-fallback .header {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1a1410, #2a1f14);
      border: 2px solid rgba(200,150,62,0.5);
      display: flex; align-items: center; justify-content: center;
      font-weight: bold; font-size: 14px; color: var(--gold-light);
      flex-shrink: 0;
    }
    .meta { flex: 1; }
    .username { font-size: 0.85rem; font-weight: 700; color: var(--gold-light); }
    .time { font-size: 0.7rem; color: var(--text-secondary); }
    .title { font-size: 0.85rem; line-height: 1.3; margin: 4px 0; }
    .badge {
      display: inline-block;
      font-size: 0.65rem; font-weight: 700; letter-spacing: 0.5px;
      padding: 2px 10px; border-radius: 20px; text-transform: uppercase;
      background: rgba(200,150,62,0.15); border: 1px solid rgba(200,150,62,0.3);
      color: var(--gold-light); align-self: flex-start;
    }
    .badge.quest { background: rgba(255,180,60,0.2); border-color: rgba(255,180,60,0.4); color: #ffb83c; }
    .badge.reward { background: rgba(100,220,140,0.18); border-color: rgba(100,220,140,0.35); color: #64dc8c; }
    .badge.event { background: rgba(180,130,255,0.18); border-color: rgba(180,130,255,0.35); color: #b482ff; }
    .badge.system { background: rgba(150,170,200,0.18); border-color: rgba(150,170,200,0.3); color: #96aac8; }

    .retry-btn {
      background: rgba(200,150,62,0.15);
      border: 1px solid rgba(200,150,62,0.5);
      color: var(--gold-light);
      padding: 10px 24px;
      border-radius: 30px;
      font-family: inherit;
      font-size: 0.85rem;
      letter-spacing: 1px;
      cursor: pointer;
      margin-top: 16px;
      transition: all 0.3s;
    }
    .retry-btn:hover { background: rgba(200,150,62,0.25); }

    /* Canvas (للوضع العادي) */
    canvas { display: block; position: absolute; inset: 0; z-index: 1; }

    @media (min-width: 600px) {
      .notif-list { flex-direction: row; flex-wrap: wrap; justify-content: center; }
      .notif-card-fallback { width: 260px; }
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="loading-screen" id="loading-screen">
    <div class="loading-ring"></div>
    <div class="loading-text">ENTERING MESORI</div>
  </div>

  <!-- وضع الاحتياطي (مخفي مبدئياً) -->
  <div class="fallback-container" id="fallback-ui">
    <div class="fallback-header">
      <h1>MESORI</h1>
      <p>الإشعارات في وضع التوافق</p>
    </div>
    <div class="notif-list" id="notif-list-fallback"></div>
    <button class="retry-btn" id="retry-webgl">🔄 إعادة تحميل المشهد الثلاثي</button>
    <p style="font-size:0.7rem; color:var(--text-secondary); margin-top:8px;">تعذر تشغيل WebGL على هذا الجهاز</p>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    // ---------- بيانات الإشعارات ----------
    const sampleNotifications = (() => {
      const now = Date.now();
      return [
        {id:'n1',anchorId:'Notification_1',title:'Pharaoh\'s Commission Ready',message:'Grand obelisk approved. Delivery at dawn.',initials:'RA',username:'Royal Architect',timestamp:now-480000,type:'quest',priority:'high',read:false},
        {id:'n2',anchorId:'Notification_2',title:'Granite Shipment Arrived',message:'12 Aswan blocks delivered.',initials:'MS',username:'Master Stonemason',timestamp:now-1500000,type:'system',priority:'medium',read:false},
        {id:'n3',anchorId:'Notification_3',title:'Temple Column Milestone',message:'Column #7 complete. +150 Reputation.',initials:'HP',username:'High Priest',timestamp:now-2700000,type:'reward',priority:'medium',read:true},
        {id:'n4',anchorId:'Notification_4',title:'Urgent: Royal Inspection',message:'Pharaoh arrives in 2 days.',initials:'VC',username:'Vizier\'s Courier',timestamp:now-720000,type:'event',priority:'urgent',read:false},
        {id:'n5',anchorId:'Notification_5',title:'Apprentice Leveled Up',message:'Khenemet achieved Journeyman.',initials:'KH',username:'Khenemet',timestamp:now-5400000,type:'reward',priority:'low',read:true},
        {id:'n6',anchorId:'Notification_6',title:'Limestone Quarry Depleted',message:'Switch to sandstone.',initials:'QS',username:'Quarry Supervisor',timestamp:now-9000000,type:'system',priority:'medium',read:true},
        {id:'n7',anchorId:'Notification_7',title:'Festival of Opet',message:'Bonus rest day granted.',initials:'TF',username:'Temple Herald',timestamp:now-12000000,type:'event',priority:'low',read:true},
        {id:'n8',anchorId:'Notification_8',title:'Tools Sharpened',message:'Copper chisels returned.',initials:'BS',username:'Bronze Smith',timestamp:now-18000000,type:'system',priority:'low',read:true}
      ];
    })();

    function formatTime(ts) {
      const diff = Date.now() - ts;
      if (diff < 60000) return 'now';
      if (diff < 3600000) return Math.floor(diff/60000)+'m';
      if (diff < 86400000) return Math.floor(diff/3600000)+'h';
      return Math.floor(diff/86400000)+'d';
    }

    // ---------- بناء واجهة الاحتياط ----------
    function buildFallbackUI() {
      const list = document.getElementById('notif-list-fallback');
      list.innerHTML = '';
      sampleNotifications.forEach(n => {
        const card = document.createElement('div');
        card.className = 'notif-card-fallback' + (n.read ? '' : ' unread');
        card.innerHTML = `
          <div class="header">
            <div class="avatar">${n.initials}</div>
            <div class="meta">
              <div class="username">${n.username}</div>
              <div class="time">${formatTime(n.timestamp)}</div>
            </div>
          </div>
          <div class="title">${n.title}</div>
          <span class="badge ${n.type}">${n.type}</span>
        `;
        list.appendChild(card);
      });
    }

    function showFallbackMode() {
      document.getElementById('loading-screen').classList.add('hidden');
      document.getElementById('fallback-ui').style.display = 'flex';
      buildFallbackUI();
    }

    document.getElementById('retry-webgl').addEventListener('click', () => {
      window.location.reload();
    });

    // ---------- محاولة تشغيل WebGL والمشهد الكامل ----------
    async function tryWebGL() {
      try {
        const [THREE, { OrbitControls }, { GLTFLoader }, { DRACOLoader }, { EffectComposer, RenderPass, UnrealBloomPass, SSAOPass, ShaderPass, AfterimagePass, OutputPass }, { RGBShiftShader }] =
          await Promise.all([
            import('three'),
            import('three/addons/controls/OrbitControls.js'),
            import('three/addons/loaders/GLTFLoader.js'),
            import('three/addons/loaders/DRACOLoader.js'),
            import('three/addons/postprocessing/EffectComposer.js'),
            import('three/addons/shaders/RGBShiftShader.js')
          ]);

        // محاولة إنشاء سياق WebGL
        let renderer;
        try {
          renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        } catch (e) {
          const canvas = document.createElement('canvas');
          const gl = canvas.getContext('webgl', { failIfMajorPerformanceCaveat: true }) ||
                     canvas.getContext('experimental-webgl', { failIfMajorPerformanceCaveat: true });
          if (!gl) throw new Error('WebGL not supported');
          renderer = new THREE.WebGLRenderer({ canvas, context: gl });
        }

        if (!renderer) throw new Error('Renderer creation failed');

        // ========== المشهد الكامل ==========
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#060a10');
        scene.fog = new THREE.FogExp2('#060a10', 0.00025);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.5, 40);
        camera.position.set(4.5, 3.2, 6.5);
        const buildingCenter = new THREE.Vector3(0, 0.8, 0);
        camera.lookAt(buildingCenter);

        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);

        // Post-processing
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const ssao = new SSAOPass(scene, camera, window.innerWidth, window.innerHeight);
        ssao.kernelRadius = 0.5; ssao.ssaoIntensity = 0.5;
        composer.addPass(ssao);
        const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.5, 0.4, 0.85);
        composer.addPass(bloom);
        const rgbShift = new ShaderPass(RGBShiftShader);
        rgbShift.uniforms['amount'].value = 0.0012;
        composer.addPass(rgbShift);
        composer.addPass(new AfterimagePass(0.15));
        composer.addPass(new OutputPass());

        // Lighting
        scene.add(new THREE.AmbientLight('#2a3050', 0.7));
        scene.add(new THREE.HemisphereLight('#8899cc', '#3a2210', 0.5));
        const sun = new THREE.DirectionalLight('#fff5e8', 4.5);
        sun.position.set(8, 10, 3);
        sun.castShadow = true;
        sun.shadow.mapSize.set(2048, 2048);
        sun.shadow.camera.near = 0.5;
        sun.shadow.camera.far = 50;
        sun.shadow.camera.left = -10;
        sun.shadow.camera.right = 10;
        sun.shadow.camera.top = 10;
        sun.shadow.camera.bottom = -10;
        scene.add(sun);
        scene.add(new THREE.DirectionalLight('#aaccff', 2.0).position.set(-3, 2, -4));
        scene.add(new THREE.DirectionalLight('#ffcc88', 1.8).position.set(0, 1.5, 5));
        scene.add(new THREE.DirectionalLight('#886633', 1.2).position.set(0, -0.5, 0));

        // Ground
        const ground = new THREE.Mesh(
          new THREE.PlaneGeometry(30, 30),
          new THREE.MeshStandardMaterial({ color: '#1a1510', roughness: 0.85 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -2.2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Particles
        const particleCount = window.innerWidth < 600 ? 200 : 600;
        const pGeo = new THREE.BufferGeometry();
        const pPos = new Float32Array(particleCount * 3);
        const pPhases = new Float32Array(particleCount);
        for (let i = 0; i < particleCount; i++) {
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.random() * Math.PI * 0.7;
          const r = 3 + Math.random() * 6;
          pPos[i * 3] = Math.cos(theta) * Math.cos(phi) * r;
          pPos[i * 3 + 1] = Math.sin(phi) * r + 0.5;
          pPos[i * 3 + 2] = Math.sin(theta) * Math.cos(phi) * r;
          pPhases[i] = Math.random() * Math.PI * 2;
        }
        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        const particles = new THREE.Points(
          pGeo,
          new THREE.PointsMaterial({ color: '#e0c878', size: 0.025, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.5 })
        );
        particles.userData.phases = pPhases;
        scene.add(particles);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.copy(buildingCenter);
        controls.minDistance = 3.5;
        controls.maxDistance = 10;
        controls.minPolarAngle = Math.PI * 0.25;
        controls.maxPolarAngle = Math.PI * 0.65;
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.15;
        controls.enablePan = false;
        controls.update();

        // نموذج GLB (مع احتياطي)
        const ANCHOR_NAMES = ['Notification_1','Notification_2','Notification_3','Notification_4','Notification_5','Notification_6','Notification_7','Notification_8'];
        const FALLBACK_OFFSETS = [
          {x:3.5,y:0.8,z:0},{x:2.5,y:1.5,z:2.5},{x:0,y:2.0,z:3.5},{x:-2.5,y:1.5,z:2.5},
          {x:-3.5,y:0.8,z:0},{x:-2.5,y:0.3,z:-2.5},{x:0,y:-0.2,z:-3.5},{x:2.5,y:0.3,z:-2.5}
        ];
        const anchorObjects = {};
        const allMeshes = [];
        let buildingModel;

        const dracoLoader = new DRACOLoader().setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/draco/');
        const gltfLoader = new GLTFLoader().setDRACOLoader(dracoLoader);

        try {
          const gltf = await gltfLoader.loadAsync('./egyptian_stone_masons_shop.glb', (p) => {
            document.querySelector('.loading-text').textContent = `LOADING ${Math.round(p.loaded/p.total*100)}%`;
          });
          buildingModel = gltf.scene;
          buildingModel.traverse(child => {
            if (ANCHOR_NAMES.includes(child.name)) anchorObjects[child.name] = child;
            if (child.isMesh) { allMeshes.push(child); child.castShadow = true; child.receiveShadow = true; }
          });
          scene.add(buildingModel);
        } catch (modelError) {
          console.warn('Model load failed, creating placeholder.', modelError);
          buildingModel = new THREE.Group();
          buildingModel.name = 'building';
          const body = new THREE.Mesh(new THREE.BoxGeometry(2, 2.5, 2), new THREE.MeshStandardMaterial({ color: '#c8b896', roughness: 0.6 }));
          body.position.y = 1.25;
          body.castShadow = true;
          buildingModel.add(body);
          allMeshes.push(body);
          FALLBACK_OFFSETS.forEach((off, i) => {
            const empty = new THREE.Object3D();
            empty.name = ANCHOR_NAMES[i];
            empty.position.set(off.x, off.y, off.z);
            buildingModel.add(empty);
            anchorObjects[ANCHOR_NAMES[i]] = empty;
          });
          scene.add(buildingModel);
        }

        // تحديث مركز المبنى
        const box = new THREE.Box3().setFromObject(buildingModel);
        const sphere = new THREE.Sphere();
        box.getBoundingSphere(sphere);
        sphere.radius *= 0.85;
        buildingCenter.copy(sphere.center);
        controls.target.copy(buildingCenter);
        controls.update();

        // ---------- نظام الإشعارات (Overlay) ----------
        const overlay = document.createElement('div');
        overlay.id = 'notification-overlay';
        overlay.style.position = 'absolute';
        overlay.style.inset = '0';
        overlay.style.pointerEvents = 'none';
        overlay.style.zIndex = '20';
        document.body.appendChild(overlay);

        const svgConnector = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svgConnector.style.position = 'absolute';
        svgConnector.style.inset = '0';
        svgConnector.style.pointerEvents = 'none';
        overlay.appendChild(svgConnector);

        const cardElements = {};
        function createCard(notif) {
          if (cardElements[notif.id]) return cardElements[notif.id];
          const card = document.createElement('div');
          card.className = 'notif-card';
          card.style.position = 'absolute';
          card.style.padding = '12px';
          card.style.background = 'rgba(14,18,30,0.8)';
          card.style.backdropFilter = 'blur(12px)';
          card.style.border = '1px solid rgba(200,150,62,0.35)';
          card.style.borderRadius = '16px';
          card.style.color = '#f0e6d3';
          card.style.width = '240px';
          card.style.pointerEvents = 'auto';
          card.innerHTML = `
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
              <div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#1a1410,#2a1f14);border:2px solid rgba(200,150,62,0.5);display:flex;align-items:center;justify-content:center;font-weight:bold;color:#e0c878;">${notif.initials}</div>
              <div style="flex:1"><div style="font-weight:700;color:#e0c878;font-size:0.8rem;">${notif.username}</div><div style="font-size:0.7rem;color:#b8a88a;">${formatTime(notif.timestamp)}</div></div>
            </div>
            <div style="font-size:0.8rem;">${notif.title}</div>
            <span style="font-size:0.6rem;padding:2px 8px;border-radius:20px;background:rgba(200,150,62,0.2);border:1px solid rgba(200,150,62,0.3);color:#e0c878;margin-top:4px;display:inline-block;">${notif.type}</span>
          `;
          overlay.appendChild(card);
          cardElements[notif.id] = card;
          return card;
        }

        function updateOverlays() {
          svgConnector.innerHTML = '';
          const buildingScreen = new THREE.Vector3().copy(buildingCenter).project(camera);
          const cx = (buildingScreen.x * 0.5 + 0.5) * window.innerWidth;
          const cy = (-buildingScreen.y * 0.5 + 0.5) * window.innerHeight;

          sampleNotifications.forEach(n => {
            const anchor = anchorObjects[n.anchorId];
            if (!anchor) return;
            const worldPos = anchor.getWorldPosition(new THREE.Vector3());
            const screen = worldPos.clone().project(camera);
            const sx = (screen.x * 0.5 + 0.5) * window.innerWidth;
            const sy = (-screen.y * 0.5 + 0.5) * window.innerHeight;
            const visible = screen.z < 1 && screen.z > 0;

            const card = createCard(n);
            if (!visible) { card.style.display = 'none'; return; }
            card.style.display = '';
            card.style.left = (sx - 120) + 'px';
            card.style.top = (sy - 40) + 'px';

            // خط الربط
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', `M${cx},${cy} Q${(cx+sx)/2},${Math.min(cy,sy)-20} ${sx},${sy}`);
            path.setAttribute('stroke', 'url(#goldGradient)');
            path.setAttribute('stroke-width', '1.5');
            path.setAttribute('fill', 'none');
            path.setAttribute('stroke-dasharray', '4 6');
            svgConnector.appendChild(path);
          });
        }

        // ---------- حلقة الأنيميشن ----------
        function animate() {
          requestAnimationFrame(animate);
          controls.update();
          if (particles) {
            const arr = particles.geometry.attributes.position.array;
            const phases = particles.userData.phases;
            for (let i = 0; i < particleCount; i++) {
              arr[i*3+1] += Math.sin(Date.now()*0.001 + phases[i]) * 0.0005;
            }
            particles.geometry.attributes.position.needsUpdate = true;
          }
          updateOverlays();
          composer.render();
        }

        // إخفاء التحميل وبدء المشهد
        document.getElementById('loading-screen').classList.add('hidden');
        animate();

      } catch (error) {
        console.error('WebGL initialization failed:', error);
        showFallbackMode();
      }
    }

    tryWebGL();
  </script>
</body>
</html>
