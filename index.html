<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesori - 3D Notification Scene</title>
    <style>
        :root {
            --bg-deep: #060a10;
            --gold: #c8963e;
            --gold-light: #e0c878;
            --gold-pale: #f5e6c8;
            --navy: #0a0f1a;
            --card-bg: rgba(14, 18, 30, 0.75);
            --card-border: rgba(200, 150, 62, 0.35);
            --glow-amber: #ffb347;
            --text-primary: #f0e6d3;
            --text-secondary: #b8a88a;
            --accent-blue: #1a3a6a;
            --danger: #c0392b;
            --unread-dot: #ff6b35;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-deep);
            font-family: 'Cinzel', 'Trajan Pro', 'Georgia', 'Times New Roman', serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            cursor: default;
        }

        #root {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Canvas fills entire viewport */
        canvas {
            display: block;
        }

        /* --- Notification Overlay Container --- */
        #notification-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 10;
        }

        /* --- Individual Notification Card --- */
        .notif-card {
            position: absolute;
            pointer-events: auto;
            width: 280px;
            padding: 14px 16px;
            border-radius: 16px;
            background: var(--card-bg);
            backdrop-filter: blur(18px) saturate(140%);
            -webkit-backdrop-filter: blur(18px) saturate(140%);
            border: 1.5px solid var(--card-border);
            box-shadow:
                0 4px 30px rgba(0, 0, 0, 0.55),
                0 0 0 1px rgba(200, 150, 62, 0.15) inset,
                0 0 40px rgba(200, 150, 62, 0.08);
            transition:
                opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                transform 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                box-shadow 0.4s ease,
                border-color 0.4s ease;
            cursor: pointer;
            color: var(--text-primary);
            will-change: transform, opacity;
        }

        .notif-card:hover {
            border-color: rgba(220, 170, 70, 0.7);
            box-shadow:
                0 8px 40px rgba(0, 0, 0, 0.6),
                0 0 0 1px rgba(220, 170, 70, 0.3) inset,
                0 0 60px rgba(200, 150, 62, 0.18),
                0 0 120px rgba(200, 150, 62, 0.06);
            transform: translateY(-3px) scale(1.03);
        }

        .notif-card.unread {
            border-left: 3px solid var(--unread-dot);
            box-shadow:
                0 4px 30px rgba(0, 0, 0, 0.55),
                0 0 0 1px rgba(200, 150, 62, 0.2) inset,
                0 0 50px rgba(255, 107, 53, 0.12);
        }

        .notif-card.urgent {
            border-color: rgba(255, 80, 40, 0.5);
            animation: urgentPulse 2.5s ease-in-out infinite;
        }

        @keyframes urgentPulse {
            0%,
            100% {
                box-shadow: 0 4px 30px rgba(0, 0, 0, 0.55), 0 0 40px rgba(255, 80, 40, 0.08);
            }
            50% {
                box-shadow: 0 4px 30px rgba(0, 0, 0, 0.55), 0 0 70px rgba(255, 80, 40, 0.22);
            }
        }

        .notif-card.occluded {
            opacity: 0.18;
            pointer-events: none;
        }

        .notif-card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .notif-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            flex-shrink: 0;
            border: 2px solid rgba(200, 150, 62, 0.5);
            background: linear-gradient(135deg, #1a1410, #2a1f14);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            color: var(--gold-light);
            letter-spacing: 1px;
        }
        .notif-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .notif-meta {
            flex: 1;
            min-width: 0;
        }
        .notif-username {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.6px;
            color: var(--gold-light);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .notif-time {
            font-size: 10px;
            color: var(--text-secondary);
            letter-spacing: 0.4px;
        }

        .notif-title {
            font-size: 12.5px;
            font-weight: 500;
            line-height: 1.4;
            color: var(--text-primary);
            letter-spacing: 0.3px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .notif-badge {
            display: inline-block;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 3px 8px;
            border-radius: 20px;
            text-transform: uppercase;
            margin-top: 6px;
            background: rgba(200, 150, 62, 0.2);
            color: var(--gold-light);
            border: 1px solid rgba(200, 150, 62, 0.3);
        }
        .notif-badge.quest {
            background: rgba(255, 180, 60, 0.2);
            border-color: rgba(255, 180, 60, 0.4);
            color: #ffb83c;
        }
        .notif-badge.reward {
            background: rgba(100, 220, 140, 0.18);
            border-color: rgba(100, 220, 140, 0.35);
            color: #64dc8c;
        }
        .notif-badge.event {
            background: rgba(180, 130, 255, 0.18);
            border-color: rgba(180, 130, 255, 0.35);
            color: #b482ff;
        }
        .notif-badge.system {
            background: rgba(150, 170, 200, 0.18);
            border-color: rgba(150, 170, 200, 0.3);
            color: #96aac8;
        }

        /* --- Glowing Connector Line (SVG) --- */
        .connector-line {
            position: absolute;
            pointer-events: none;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
        }
        .connector-line path {
            fill: none;
            stroke: url(#goldGradient);
            stroke-width: 1.8;
            stroke-dasharray: 6 8;
            stroke-dashoffset: 0;
            animation: dashFlow 2s linear infinite;
            filter: drop-shadow(0 0 6px rgba(220, 160, 50, 0.7)) drop-shadow(0 0 14px rgba(200, 140, 40, 0.35));
            opacity: 0.75;
        }
        @keyframes dashFlow {
            to {
                stroke-dashoffset: -28;
            }
        }

        /* --- Modal --- */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }
        .modal-content {
            background: rgba(16, 22, 36, 0.9);
            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            border: 1.5px solid rgba(200, 150, 62, 0.45);
            border-radius: 20px;
            padding: 28px 32px;
            max-width: 460px;
            width: 90%;
            color: var(--text-primary);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 80px rgba(200, 150, 62, 0.1);
            animation: modalIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.92) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .modal-close {
            float: right;
            background: none;
            border: 1px solid rgba(200, 150, 62, 0.3);
            color: var(--gold-light);
            font-size: 18px;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 8px;
            transition: all 0.3s;
        }
        .modal-close:hover {
            background: rgba(200, 150, 62, 0.2);
            border-color: rgba(200, 150, 62, 0.6);
        }

        /* --- Loading Screen --- */
        .loading-screen {
            position: fixed;
            inset: 0;
            z-index: 999;
            background: var(--bg-deep);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease;
            pointer-events: all;
        }
        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loading-ring {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(200, 150, 62, 0.2);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .loading-text {
            margin-top: 18px;
            color: var(--gold-light);
            letter-spacing: 2px;
            font-size: 13px;
            animation: fadePulse 1.8s ease-in-out infinite;
        }
        @keyframes fadePulse {
            0%,
            100% {
                opacity: 0.5;
            }
            50% {
                opacity: 1;
            }
        }

        /* --- Responsive --- */
        @media (max-width: 768px) {
            .notif-card {
                width: 220px;
                padding: 10px 12px;
                border-radius: 12px;
                font-size: 11px;
            }
            .notif-avatar {
                width: 30px;
                height: 30px;
                font-size: 11px;
            }
            .notif-username {
                font-size: 11px;
            }
            .notif-title {
                font-size: 10.5px;
            }
            .modal-content {
                padding: 20px 18px;
                max-width: 92%;
            }
        }
        @media (max-width: 480px) {
            .notif-card {
                width: 175px;
                padding: 8px 10px;
                border-radius: 10px;
            }
            .notif-avatar {
                width: 26px;
                height: 26px;
                font-size: 10px;
            }
            .notif-username {
                font-size: 10px;
            }
            .notif-title {
                font-size: 9.5px;
                -webkit-line-clamp: 1;
            }
            .notif-badge {
                font-size: 7px;
                padding: 2px 6px;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            .notif-card,
            .connector-line path,
            .modal-content,
            .loading-ring,
            .loading-text {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
            .notif-card {
                transition: opacity 0.15s ease !important;
            }
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="root">
        <!-- Loading Screen -->
        <div class="loading-screen" id="loading-screen">
            <div class="loading-ring"></div>
            <div class="loading-text">ENTERING MESORI</div>
        </div>
    </div>

    <!-- SVG Gradient Definitions for Connector Lines -->
    <svg style="position:absolute;width:0;height:0;pointer-events:none;" aria-hidden="true">
        <defs>
            <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#c8963e" stop-opacity="0.9" />
                <stop offset="50%" stop-color="#f0d78c" stop-opacity="1" />
                <stop offset="100%" stop-color="#c8963e" stop-opacity="0.9" />
            </linearGradient>
            <radialGradient id="glowDot" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#f0d78c" stop-opacity="1" />
                <stop offset="60%" stop-color="#c8963e" stop-opacity="0.5" />
                <stop offset="100%" stop-color="#c8963e" stop-opacity="0" />
            </radialGradient>
            <filter id="glowFilter" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="3" result="blur" />
                <feMerge>
                    <feMergeNode in="blur" />
                    <feMergeNode in="SourceGraphic" />
                </feMerge>
            </filter>
        </defs>
    </svg>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { SSAOPass } from 'three/addons/postprocessing/SSAOPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
        import { RGBShiftShader } from 'three/addons/shaders/RGBShiftShader.js';
        import { AfterimagePass } from 'three/addons/postprocessing/AfterimagePass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

        // ==================== CONSTANTS ====================
        const BUILDING_MODEL_PATH = './egyptian_stone_masons_shop.glb';
        const NOTIFICATION_ANCHOR_NAMES = [
            'Notification_1', 'Notification_2', 'Notification_3',
            'Notification_4', 'Notification_5', 'Notification_6',
            'Notification_7', 'Notification_8',
        ];
        const FALLBACK_ANCHOR_OFFSETS = [
            { x: 3.5, y: 0.8, z: 0 },
            { x: 2.5, y: 1.5, z: 2.5 },
            { x: 0, y: 2.0, z: 3.5 },
            { x: -2.5, y: 1.5, z: 2.5 },
            { x: -3.5, y: 0.8, z: 0 },
            { x: -2.5, y: 0.3, z: -2.5 },
            { x: 0, y: -0.2, z: -3.5 },
            { x: 2.5, y: 0.3, z: -2.5 },
        ];
        const CAMERA_CONFIG = {
            minDistance: 3.5,
            maxDistance: 10,
            minPolarAngle: Math.PI * 0.25,
            maxPolarAngle: Math.PI * 0.65,
            dampingFactor: 0.08,
            autoRotateSpeed: 0.15,
            idleFloatAmplitude: 0.08,
            idleFloatFrequency: 0.4,
            focusZoomDuration: 1.2,
        };

        // ==================== DOM ELEMENTS ====================
        const root = document.getElementById('root');
        const loadingScreen = document.getElementById('loading-screen');
        const overlayContainer = document.createElement('div');
        overlayContainer.id = 'notification-overlay';
        root.appendChild(overlayContainer);

        const connectorSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        connectorSvg.classList.add('connector-line');
        connectorSvg.setAttribute('aria-hidden', 'true');
        overlayContainer.appendChild(connectorSvg);

        // ==================== STATE (Zustand-like store) ====================
        const store = {
            notifications: [],
            selectedNotificationId: null,
            hoveredNotificationId: null,
            isModalOpen: false,
            anchorWorldPositions: {}, // anchorId -> THREE.Vector3
            buildingCenter: new THREE.Vector3(0, 0.8, 0),
            buildingBoundingSphere: new THREE.Sphere(new THREE.Vector3(0, 0.8, 0), 2.2),

            selectNotification(id) {
                this.selectedNotificationId = id;
                this.isModalOpen = true;
            },
            closeModal() {
                this.isModalOpen = false;
                this.selectedNotificationId = null;
            },
            hoverNotification(id) {
                this.hoveredNotificationId = id;
            },
            unhoverNotification() {
                this.hoveredNotificationId = null;
            },
            markRead(id) {
                const n = this.notifications.find(n => n.id === id);
                if (n) n.read = true;
            },
            removeNotification(id) {
                this.notifications = this.notifications.filter(n => n.id !== id);
                if (this.selectedNotificationId === id) this.closeModal();
            },
            addNotification(notif) {
                this.notifications.unshift(notif);
            },
            getUnreadCount() {
                return this.notifications.filter(n => !n.read).length;
            },
            getSelectedNotification() {
                return this.notifications.find(n => n.id === this.selectedNotificationId) || null;
            },
        };

        // ==================== SAMPLE NOTIFICATION DATA ====================
        function generateSampleNotifications() {
            const now = Date.now();
            return [
                {
                    id: 'n1',
                    anchorId: 'Notification_1',
                    title: 'Pharaoh\'s Commission Ready',
                    message: 'The grand obelisk carving has been approved by the royal vizier. Delivery expected at dawn.',
                    avatar: '',
                    initials: 'RA',
                    username: 'Royal Architect',
                    timestamp: now - 1000 * 60 * 8,
                    type: 'quest',
                    priority: 'high',
                    read: false,
                },
                {
                    id: 'n2',
                    anchorId: 'Notification_2',
                    title: 'New Granite Shipment Arrived',
                    message: 'Twelve blocks of Aswan granite delivered to the workshop yard.',
                    avatar: '',
                    initials: 'MS',
                    username: 'Master Stonemason',
                    timestamp: now - 1000 * 60 * 25,
                    type: 'system',
                    priority: 'medium',
                    read: false,
                },
                {
                    id: 'n3',
                    anchorId: 'Notification_3',
                    title: 'Temple Column Milestone',
                    message: 'Column #7 inscription complete. +150 reputation with Priesthood of Amun.',
                    avatar: '',
                    initials: 'HP',
                    username: 'High Priest',
                    timestamp: now - 1000 * 60 * 45,
                    type: 'reward',
                    priority: 'medium',
                    read: true,
                },
                {
                    id: 'n4',
                    anchorId: 'Notification_4',
                    title: 'Urgent: Royal Inspection',
                    message: 'The Pharaoh\'s entourage arrives in 2 days. All unfinished works must be covered.',
                    avatar: '',
                    initials: 'VC',
                    username: 'Vizier\'s Courier',
                    timestamp: now - 1000 * 60 * 12,
                    type: 'event',
                    priority: 'urgent',
                    read: false,
                },
                {
                    id: 'n5',
                    anchorId: 'Notification_5',
                    title: 'Apprentice Leveled Up',
                    message: 'Khenemet has achieved Journeyman carver status. Unlocked: Hieroglyph detail work.',
                    avatar: '',
                    initials: 'KH',
                    username: 'Khenemet',
                    timestamp: now - 1000 * 60 * 90,
                    type: 'reward',
                    priority: 'low',
                    read: true,
                },
                {
                    id: 'n6',
                    anchorId: 'Notification_6',
                    title: 'Limestone Quarry Depleted',
                    message: 'Eastern quarry reports final block extracted. Switch to sandstone for minor works.',
                    avatar: '',
                    initials: 'QS',
                    username: 'Quarry Supervisor',
                    timestamp: now - 1000 * 60 * 150,
                    type: 'system',
                    priority: 'medium',
                    read: true,
                },
                {
                    id: 'n7',
                    anchorId: 'Notification_7',
                    title: 'Festival of Opet Announced',
                    message: 'All craftsmen invited to the grand procession. Bonus rest day granted.',
                    avatar: '',
                    initials: 'TF',
                    username: 'Temple Festival Herald',
                    timestamp: now - 1000 * 60 * 200,
                    type: 'event',
                    priority: 'low',
                    read: true,
                },
                {
                    id: 'n8',
                    anchorId: 'Notification_8',
                    title: 'Tool Sharpening Complete',
                    message: 'Copper chisels and adzes returned from the smithy. Ready for use.',
                    avatar: '',
                    initials: 'BS',
                    username: 'Bronze Smith',
                    timestamp: now - 1000 * 60 * 300,
                    type: 'system',
                    priority: 'low',
                    read: true,
                },
            ];
        }
        store.notifications = generateSampleNotifications();

        // ==================== THREE.JS SETUP ====================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#060a10');
        scene.fog = new THREE.FogExp2('#060a10', 0.00025);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.5, 40);
        camera.position.set(4.5, 3.2, 6.5);
        camera.lookAt(store.buildingCenter);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        root.appendChild(renderer.domElement);

        // ==================== POST-PROCESSING ====================
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        // SSAO
        const ssaoPass = new SSAOPass(scene, camera, window.innerWidth, window.innerHeight);
        ssaoPass.kernelRadius = 0.5;
        ssaoPass.minDistance = 0.001;
        ssaoPass.maxDistance = 0.05;
        ssaoPass.ssaoIntensity = 0.6;
        ssaoPass.output = SSAOPass.OUTPUT.Default;
        composer.addPass(ssaoPass);

        // Bloom
        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            0.5, // strength
            0.4, // radius
            0.85 // threshold
        );
        composer.addPass(bloomPass);

        // Subtle RGB shift for cinematic feel
        const rgbShiftPass = new ShaderPass(RGBShiftShader);
        rgbShiftPass.uniforms['amount'].value = 0.0012;
        composer.addPass(rgbShiftPass);

        // Afterimage for subtle motion trails
        const afterimagePass = new AfterimagePass(0.15);
        composer.addPass(afterimagePass);

        // Output pass
        const outputPass = new OutputPass();
        composer.addPass(outputPass);

        // ==================== LIGHTING ====================
        // Ambient
        const ambientLight = new THREE.AmbientLight('#2a3050', 0.7);
        scene.add(ambientLight);

        // Hemisphere (sky/ground)
        const hemiLight = new THREE.HemisphereLight('#8899cc', '#3a2210', 0.5);
        scene.add(hemiLight);

        // Main directional (sun)
        const sunLight = new THREE.DirectionalLight('#fff5e8', 4.5);
        sunLight.position.set(8, 10, 3);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 50;
        sunLight.shadow.camera.left = -10;
        sunLight.shadow.camera.right = 10;
        sunLight.shadow.camera.top = 10;
        sunLight.shadow.camera.bottom = -10;
        sunLight.shadow.bias = -0.0004;
        sunLight.shadow.normalBias = 0.02;
        scene.add(sunLight);

        // Rim light
        const rimLight = new THREE.DirectionalLight('#aaccff', 2.0);
        rimLight.position.set(-3, 2, -4);
        scene.add(rimLight);

        // Fill light (warm)
        const fillLight = new THREE.DirectionalLight('#ffcc88', 1.8);
        fillLight.position.set(0, 1.5, 5);
        scene.add(fillLight);

        // Ground bounce
        const bounceLight = new THREE.DirectionalLight('#886633', 1.2);
        bounceLight.position.set(0, -0.5, 0);
        scene.add(bounceLight);

        // ==================== CONTROLS ====================
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.copy(store.buildingCenter);
        controls.minDistance = CAMERA_CONFIG.minDistance;
        controls.maxDistance = CAMERA_CONFIG.maxDistance;
        controls.minPolarAngle = CAMERA_CONFIG.minPolarAngle;
        controls.maxPolarAngle = CAMERA_CONFIG.maxPolarAngle;
        controls.enableDamping = true;
        controls.dampingFactor = CAMERA_CONFIG.dampingFactor;
        controls.autoRotate = true;
        controls.autoRotateSpeed = CAMERA_CONFIG.autoRotateSpeed;
        controls.enablePan = false;
        controls.maxAzimuthAngle = Infinity;
        controls.update();

        // ==================== GROUND PLANE ====================
        const groundGeo = new THREE.PlaneGeometry(30, 30);
        const groundMat = new THREE.MeshStandardMaterial({
            color: '#1a1510',
            roughness: 0.85,
            metalness: 0.05,
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -2.2;
        ground.receiveShadow = true;
        scene.add(ground);

        // ==================== DECORATIVE PEDESTAL ====================
        const pedestalGeo = new THREE.CylinderGeometry(1.6, 1.8, 0.35, 48);
        const pedestalMat = new THREE.MeshStandardMaterial({
            color: '#3a3028',
            roughness: 0.5,
            metalness: 0.3,
        });
        const pedestal = new THREE.Mesh(pedestalGeo, pedestalMat);
        pedestal.position.y = -1.95;
        pedestal.castShadow = true;
        pedestal.receiveShadow = true;
        scene.add(pedestal);

        // Decorative ring
        const ringGeo = new THREE.TorusGeometry(1.7, 0.06, 16, 64);
        const ringMat = new THREE.MeshStandardMaterial({
            color: '#c8963e',
            roughness: 0.3,
            metalness: 0.8,
            emissive: '#332200',
            emissiveIntensity: 0.4,
        });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2;
        ring.position.y = -1.77;
        ring.castShadow = true;
        scene.add(ring);

        // ==================== PARTICLES ====================
        const particlesCount = 600;
        const particlesGeo = new THREE.BufferGeometry();
        const particlesPositions = new Float32Array(particlesCount * 3);
        const particlesSizes = new Float32Array(particlesCount);
        const particlesPhases = new Float32Array(particlesCount);

        for (let i = 0; i < particlesCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.random() * Math.PI * 0.7;
            const radius = 3 + Math.random() * 6;
            particlesPositions[i * 3] = Math.cos(theta) * Math.cos(phi) * radius;
            particlesPositions[i * 3 + 1] = Math.sin(phi) * radius + 0.5;
            particlesPositions[i * 3 + 2] = Math.sin(theta) * Math.cos(phi) * radius;
            particlesSizes[i] = Math.random() * 3.5 + 1;
            particlesPhases[i] = Math.random() * Math.PI * 2;
        }

        particlesGeo.setAttribute('position', new THREE.BufferAttribute(particlesPositions, 3));
        particlesGeo.setAttribute('size', new THREE.BufferAttribute(particlesSizes, 1));

        const particlesMat = new THREE.PointsMaterial({
            color: '#e0c878',
            size: 0.025,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true,
            opacity: 0.55,
        });
        const particles = new THREE.Points(particlesGeo, particlesMat);
        particles.name = 'dustParticles';
        scene.add(particles);

        // Store phases on the object for animation
        particles.userData.phases = particlesPhases;

        // ==================== GLB LOADING ====================
        let buildingModel = null;
        const anchorObjects = {}; // anchorId -> THREE.Object3D
        const allBuildingMeshes = [];

        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/draco/');

        const gltfLoader = new GLTFLoader();
        gltfLoader.setDRACOLoader(dracoLoader);

        function findAnchorsInScene(gltfScene) {
            const found = {};
            gltfScene.traverse((child) => {
                if (NOTIFICATION_ANCHOR_NAMES.includes(child.name)) {
                    found[child.name] = child;
                    console.log(`✅ Found anchor: ${child.name} at`, child.position);
                }
                if (child.isMesh || child.isSkinnedMesh) {
                    allBuildingMeshes.push(child);
                }
            });
            return found;
        }

        function computeBuildingBoundingSphere(gltfScene) {
            const box = new THREE.Box3();
            gltfScene.traverse((child) => {
                if (child.isMesh || child.isSkinnedMesh) {
                    box.expandByObject(child);
                }
            });
            const center = new THREE.Vector3();
            box.getCenter(center);
            const sphere = new THREE.Sphere();
            box.getBoundingSphere(sphere);
            sphere.radius *= 0.85; // slightly tighten
            return sphere;
        }

        function setupBuildingMaterials(gltfScene) {
            gltfScene.traverse((child) => {
                if (child.isMesh && child.material) {
                    const materials = Array.isArray(child.material) ? child.material : [child.material];
                    materials.forEach(mat => {
                        if (mat.isMeshStandardMaterial || mat.isMeshPhongMaterial) {
                            mat.needsUpdate = true;
                            mat.castShadow = true;
                            mat.receiveShadow = true;
                            // Store original for hover highlight
                            mat.userData = {
                                originalEmissive: mat.emissive ? mat.emissive.getHex() : 0,
                                originalEmissiveIntensity: mat.emissiveIntensity || 0,
                            };
                        }
                    });
                }
            });
        }

        function loadBuildingModel() {
            return new Promise((resolve, reject) => {
                gltfLoader.load(
                    BUILDING_MODEL_PATH,
                    (gltf) => {
                        buildingModel = gltf.scene;
                        buildingModel.name = 'building';
                        setupBuildingMaterials(buildingModel);
                        scene.add(buildingModel);

                        // Find anchors
                        const foundAnchors = findAnchorsInScene(buildingModel);
                        Object.assign(anchorObjects, foundAnchors);

                        // Compute bounding sphere
                        store.buildingBoundingSphere = computeBuildingBoundingSphere(buildingModel);
                        store.buildingCenter.copy(store.buildingBoundingSphere.center);
                        controls.target.copy(store.buildingCenter);
                        controls.update();

                        console.log('🏛️ Building loaded. Anchors found:', Object.keys(foundAnchors).length);
                        console.log('📦 Building center:', store.buildingCenter);
                        console.log('🔵 Bounding sphere radius:', store.buildingBoundingSphere.radius);
                        resolve(gltf);
                    },
                    (progress) => {
                        const pct = Math.round((progress.loaded / progress.total) * 100);
                        document.querySelector('.loading-text').textContent =
                            `LOADING ASSETS... ${pct}%`;
                    },
                    (error) => {
                        console.error('Failed to load building model:', error);
                        // Create a placeholder building
                        createPlaceholderBuilding();
                        resolve(null);
                    }
                );
            });
        }

        function createPlaceholderBuilding() {
            console.warn('⚠️ Creating placeholder building since GLB failed to load.');
            const group = new THREE.Group();
            group.name = 'building';

            // Main structure
            const bodyGeo = new THREE.BoxGeometry(2, 2.5, 2);
            const bodyMat = new THREE.MeshStandardMaterial({
                color: '#c8b896',
                roughness: 0.6,
                metalness: 0.1,
            });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1.25;
            body.castShadow = true;
            body.receiveShadow = true;
            group.add(body);
            allBuildingMeshes.push(body);

            // Roof
            const roofGeo = new THREE.ConeGeometry(1.5, 0.8, 4);
            const roofMat = new THREE.MeshStandardMaterial({
                color: '#8b6914',
                roughness: 0.4,
                metalness: 0.3,
            });
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.position.y = 2.9;
            roof.rotation.y = Math.PI / 4;
            roof.castShadow = true;
            group.add(roof);
            allBuildingMeshes.push(roof);

            // Columns
            for (let i = 0; i < 4; i++) {
                const angle = (i / 4) * Math.PI * 2 + Math.PI / 4;
                const colGeo = new THREE.CylinderGeometry(0.15, 0.18, 2, 16);
                const col = new THREE.Mesh(colGeo, bodyMat.clone());
                col.position.set(Math.cos(angle) * 1.2, 1, Math.sin(angle) * 1.2);
                col.castShadow = true;
                col.receiveShadow = true;
                group.add(col);
                allBuildingMeshes.push(col);
            }

            // Create fallback anchor empties
            FALLBACK_ANCHOR_OFFSETS.forEach((offset, i) => {
                const anchorName = NOTIFICATION_ANCHOR_NAMES[i];
                const empty = new THREE.Object3D();
                empty.name = anchorName;
                empty.position.set(offset.x, offset.y, offset.z);
                group.add(empty);
                anchorObjects[anchorName] = empty;
            });

            buildingModel = group;
            scene.add(group);
            store.buildingBoundingSphere = computeBuildingBoundingSphere(group);
            store.buildingCenter.copy(store.buildingBoundingSphere.center);
            controls.target.copy(store.buildingCenter);
            controls.update();
            console.log('🏛️ Placeholder building created with', Object.keys(anchorObjects).length, 'anchors.');
        }

        // ==================== RAYCASTER ====================
        const raycaster = new THREE.Raycaster();
        raycaster.far = 15;
        const mouse = new THREE.Vector2();
        let hoveredMesh = null;
        const highlightedMaterials = [];

        function updateMouse(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        }

        function getIntersections() {
            raycaster.setFromCamera(mouse, camera);
            const targets = [...allBuildingMeshes];
            // Also include anchor empties as sphere-cast targets
            const anchorValues = Object.values(anchorObjects);
            const allTargets = [...targets];
            return raycaster.intersectObjects(allTargets, true);
        }

        function highlightMesh(mesh) {
            if (!mesh || !mesh.material) return;
            const materials = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
            materials.forEach(mat => {
                if (mat.isMeshStandardMaterial && !highlightedMaterials.includes(mat)) {
                    highlightedMaterials.push(mat);
                    mat.emissive = new THREE.Color('#ffd080');
                    mat.emissiveIntensity = 0.55;
                }
            });
        }

        function unhighlightAll() {
            highlightedMaterials.forEach(mat => {
                if (mat.userData && mat.userData.originalEmissive !== undefined) {
                    mat.emissive = new THREE.Color(mat.userData.originalEmissive);
                    mat.emissiveIntensity = mat.userData.originalEmissiveIntensity;
                } else {
                    mat.emissive = new THREE.Color(0x000000);
                    mat.emissiveIntensity = 0;
                }
            });
            highlightedMaterials.length = 0;
            hoveredMesh = null;
        }

        function getHoveredAnchor(event) {
            updateMouse(event);
            raycaster.setFromCamera(mouse, camera);

            // Check each anchor with a small sphere cast
            const anchorEntries = Object.entries(anchorObjects);
            for (const [anchorId, anchorObj] of anchorEntries) {
                const worldPos = new THREE.Vector3();
                anchorObj.getWorldPosition(worldPos);
                const screenPos = worldToScreen(worldPos, camera);
                if (!screenPos) continue;

                const dx = event.clientX - screenPos.x;
                const dy = event.clientY - screenPos.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const hitRadius = 40; // pixels
                if (dist < hitRadius) {
                    return anchorId;
                }
            }

            // Also check building meshes
            const intersects = raycaster.intersectObjects(allBuildingMeshes, true);
            if (intersects.length > 0) {
                const obj = intersects[0].object;
                if (obj !== hoveredMesh) {
                    unhighlightAll();
                    hoveredMesh = obj;
                    highlightMesh(obj);
                }
                return null; // hovering building
            }

            if (hoveredMesh) {
                unhighlightAll();
            }
            return null;
        }

        // ==================== WORLD TO SCREEN ====================
        function worldToScreen(worldPos, cam) {
            const vector = worldPos.clone().project(cam);
            const halfW = window.innerWidth / 2;
            const halfH = window.innerHeight / 2;
            return {
                x: (vector.x * halfW) + halfW,
                y: -(vector.y * halfH) + halfH,
                visible: vector.z < 1 && vector.z > 0,
                z: vector.z,
            };
        }

        // ==================== NOTIFICATION OVERLAY RENDERING ====================
        const cardElements = {}; // id -> DOM element
        let modalElement = null;

        function createCardElement(notif, screenPos) {
            const existing = cardElements[notif.id];
            if (existing) {
                existing.style.left = screenPos.x + 'px';
                existing.style.top = screenPos.y + 'px';
                return existing;
            }

            const card = document.createElement('div');
            card.className = 'notif-card';
            if (!notif.read) card.classList.add('unread');
            if (notif.priority === 'urgent') card.classList.add('urgent');
            card.dataset.notifId = notif.id;
            card.style.left = screenPos.x + 'px';
            card.style.top = screenPos.y + 'px';
            card.style.transform = 'translate(-50%, -50%)';

            card.innerHTML = `
            <div class="notif-card-header">
              <div class="notif-avatar">${notif.initials}</div>
              <div class="notif-meta">
                <div class="notif-username">${notif.username}</div>
                <div class="notif-time">${formatTime(notif.timestamp)}</div>
              </div>
            </div>
            <div class="notif-title">${notif.title}</div>
            <span class="notif-badge ${notif.type}">${notif.type}</span>
          `;

            card.addEventListener('click', (e) => {
                e.stopPropagation();
                handleCardClick(notif.id);
            });
            card.addEventListener('mouseenter', () => {
                store.hoverNotification(notif.id);
                card.style.zIndex = '20';
            });
            card.addEventListener('mouseleave', () => {
                store.unhoverNotification();
                card.style.zIndex = '';
            });

            overlayContainer.appendChild(card);
            cardElements[notif.id] = card;
            return card;
        }

        function removeCardElement(id) {
            const card = cardElements[id];
            if (card) {
                card.style.opacity = '0';
                card.style.transform = 'translate(-50%, -50%) scale(0.8)';
                setTimeout(() => {
                    card.remove();
                    delete cardElements[id];
                }, 350);
            }
        }

        function formatTime(timestamp) {
            const diff = Date.now() - timestamp;
            const mins = Math.floor(diff / 60000);
            if (mins < 1) return 'Just now';
            if (mins < 60) return `${mins}m ago`;
            const hours = Math.floor(mins / 60);
            if (hours < 24) return `${hours}h ago`;
            const days = Math.floor(hours / 24);
            return `${days}d ago`;
        }

        function handleCardClick(notifId) {
            store.selectNotification(notifId);
            store.markRead(notifId);
            const card = cardElements[notifId];
            if (card) card.classList.remove('unread');
            showModal();
            // Camera focus animation
            animateCameraToAnchor(notifId);
        }

        function showModal() {
            if (modalElement) return;
            const notif = store.getSelectedNotification();
            if (!notif) return;

            modalElement = document.createElement('div');
            modalElement.className = 'modal-backdrop';
            modalElement.innerHTML = `
            <div class="modal-content">
              <button class="modal-close" aria-label="Close modal">✕</button>
              <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;">
                <div class="notif-avatar" style="width:48px;height:48px;font-size:18px;">${notif.initials}</div>
                <div>
                  <div style="font-weight:700;font-size:15px;color:var(--gold-light);">${notif.username}</div>
                  <div style="font-size:11px;color:var(--text-secondary);">${formatTime(notif.timestamp)}</div>
                </div>
              </div>
              <h3 style="font-size:17px;margin-bottom:8px;letter-spacing:0.5px;">${notif.title}</h3>
              <p style="font-size:13px;line-height:1.6;color:var(--text-secondary);">${notif.message}</p>
              <span class="notif-badge ${notif.type}" style="margin-top:12px;">${notif.type} · ${notif.priority} priority</span>
              <div style="margin-top:18px;display:flex;gap:10px;">
                <button class="modal-close" style="float:none;font-size:13px;padding:8px 16px;">Dismiss</button>
                <button style="background:rgba(200,150,62,0.25);border:1px solid rgba(200,150,62,0.5);color:var(--gold-light);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;letter-spacing:0.5px;">View Details</button>
              </div>
            </div>
          `;
            modalElement.addEventListener('click', (e) => {
                if (e.target === modalElement || e.target.classList.contains('modal-close')) {
                    closeModal();
                }
            });
            document.body.appendChild(modalElement);
        }

        function closeModal() {
            if (modalElement) {
                modalElement.style.opacity = '0';
                modalElement.style.transition = 'opacity 0.25s ease';
                setTimeout(() => {
                    modalElement?.remove();
                    modalElement = null;
                }, 250);
            }
            store.closeModal();
        }

        function updateConnectorLines() {
            // Clear existing paths
            while (connectorSvg.firstChild) {
                connectorSvg.removeChild(connectorSvg.firstChild);
            }

            const buildingScreenPos = worldToScreen(store.buildingCenter, camera);
            if (!buildingScreenPos || !buildingScreenPos.visible) return;

            const cx = buildingScreenPos.x;
            const cy = buildingScreenPos.y;

            store.notifications.forEach(notif => {
                const anchorObj = anchorObjects[notif.anchorId];
                if (!anchorObj) return;

                const worldPos = new THREE.Vector3();
                anchorObj.getWorldPosition(worldPos);
                const screenPos = worldToScreen(worldPos, camera);
                if (!screenPos || !screenPos.visible) return;

                // Check occlusion
                const isOccluded = checkOcclusion(worldPos);
                const card = cardElements[notif.id];
                if (card) {
                    if (isOccluded) {
                        card.classList.add('occluded');
                    } else {
                        card.classList.remove('occluded');
                    }
                }
                if (isOccluded && !store.hoveredNotificationId === notif.id) return;

                // Draw connector path
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                const midX = (cx + screenPos.x) / 2;
                const midY = Math.min(cx, screenPos.y) - 30 - Math.abs(cx - screenPos.x) * 0.2;
                const d =
                    `M${cx},${cy} Q${midX},${midY} ${screenPos.x},${screenPos.y}`;
                path.setAttribute('d', d);
                path.setAttribute('filter', 'url(#glowFilter)');
                connectorSvg.appendChild(path);

                // Small glowing dot at the building connection point
                const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                dot.setAttribute('cx', cx);
                dot.setAttribute('cy', cy);
                dot.setAttribute('r', '4');
                dot.setAttribute('fill', 'url(#glowDot)');
                connectorSvg.appendChild(dot);
            });
        }

        function checkOcclusion(anchorWorldPos) {
            const camPos = camera.position;
            const dirToAnchor = anchorWorldPos.clone().sub(camPos).normalize();
            const distToAnchor = camPos.distanceTo(anchorWorldPos);
            const dirToBuilding = store.buildingCenter.clone().sub(camPos).normalize();
            const dotProduct = dirToAnchor.dot(dirToBuilding);

            // If anchor is behind the building relative to camera
            const anchorDist = camPos.distanceTo(anchorWorldPos);
            const buildingDist = camPos.distanceTo(store.buildingCenter);
            const anchorBehindBuilding = anchorDist > buildingDist + store.buildingBoundingSphere.radius * 0.5;
            const angleAway = dotProduct < 0.25;

            return anchorBehindBuilding && angleAway;
        }

        function updateAllOverlays() {
            store.notifications.forEach(notif => {
                const anchorObj = anchorObjects[notif.anchorId];
                if (!anchorObj) return;

                const worldPos = new THREE.Vector3();
                anchorObj.getWorldPosition(worldPos);
                store.anchorWorldPositions[notif.anchorId] = worldPos.clone();

                const screenPos = worldToScreen(worldPos, camera);
                if (!screenPos || !screenPos.visible) {
                    const card = cardElements[notif.id];
                    if (card) card.style.opacity = '0';
                    return;
                }

                const card = createCardElement(notif, screenPos);
                card.style.opacity = checkOcclusion(worldPos) ? '0.2' : '1';

                // Apply floating offset
                const floatOffset = getFloatOffset(notif.id, performance.now() / 1000);
                card.style.transform = `translate(calc(-50% + ${floatOffset.x}px), calc(-50% + ${floatOffset.y}px))`;
            });

            // Remove cards for deleted notifications
            const activeIds = new Set(store.notifications.map(n => n.id));
            Object.keys(cardElements).forEach(id => {
                if (!activeIds.has(id)) removeCardElement(id);
            });

            updateConnectorLines();
        }

        const floatPhases = {};
        function getFloatOffset(notifId, time) {
            if (!floatPhases[notifId]) {
                floatPhases[notifId] = {
                    phaseX: Math.random() * Math.PI * 2,
                    phaseY: Math.random() * Math.PI * 2,
                    freqX: 0.6 + Math.random() * 0.8,
                    freqY: 0.5 + Math.random() * 0.9,
                };
            }
            const p = floatPhases[notifId];
            return {
                x: Math.sin(time * p.freqX + p.phaseX) * 6,
                y: Math.cos(time * p.freqY + p.phaseY) * 5,
            };
        }

        // ==================== CAMERA ANIMATION ====================
        let cameraAnimTarget = null;
        let cameraAnimStart = null;
        let cameraAnimDuration = 0;
        let cameraAnimElapsed = 0;
        let cameraAnimStartPos = new THREE.Vector3();
        let cameraAnimStartTarget = new THREE.Vector3();
        let cameraAnimEndPos = new THREE.Vector3();
        let cameraAnimEndTarget = new THREE.Vector3();

        function animateCameraToAnchor(notifId) {
            const notif = store.notifications.find(n => n.id === notifId);
            if (!notif) return;
            const anchorObj = anchorObjects[notif.anchorId];
            if (!anchorObj) return;

            const worldPos = new THREE.Vector3();
            anchorObj.getWorldPosition(worldPos);

            cameraAnimStartPos.copy(camera.position);
            cameraAnimStartTarget.copy(controls.target);

            // Move camera slightly toward the anchor
            const dirFromBuilding = worldPos.clone().sub(store.buildingCenter).normalize();
            cameraAnimEndTarget.copy(worldPos);
            cameraAnimEndPos.copy(worldPos.clone().add(dirFromBuilding.multiplyScalar(3.5)));
            cameraAnimEndPos.y += 0.8;

            cameraAnimElapsed = 0;
            cameraAnimDuration = CAMERA_CONFIG.focusZoomDuration;
            cameraAnimTarget = notifId;
            cameraAnimStart = performance.now() / 1000;
        }

        function updateCameraAnimation(now) {
            if (!cameraAnimTarget) return;
            const elapsed = now - cameraAnimStart;
            const t = Math.min(elapsed / cameraAnimDuration, 1.0);
            // Ease in-out
            const eased = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;

            camera.position.lerpVectors(cameraAnimStartPos, cameraAnimEndPos, eased);
            controls.target.lerpVectors(cameraAnimStartTarget, cameraAnimEndTarget, eased);
            controls.update();

            if (t >= 1.0) {
                // Return to normal after a delay
                setTimeout(() => {
                    cameraAnimTarget = null;
                }, 2000);
            }
        }

        function resetCameraAnimation() {
            if (cameraAnimTarget && performance.now() / 1000 - cameraAnimStart > cameraAnimDuration + 2) {
                cameraAnimTarget = null;
                // Smoothly return
                const returnTarget = store.buildingCenter.clone();
                controls.target.lerp(returnTarget, 0.03);
            }
        }

        // ==================== EVENT HANDLERS ====================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
            ssaoPass.setSize(window.innerWidth, window.innerHeight);
            bloomPass.resolution.set(window.innerWidth, window.innerHeight);
        });

        window.addEventListener('mousemove', (event) => {
            if (store.isModalOpen) return;
            const hoveredAnchor = getHoveredAnchor(event);
            if (hoveredAnchor) {
                store.hoverNotification(
                    store.notifications.find(n => n.anchorId === hoveredAnchor)?.id || null
                );
                document.body.style.cursor = 'pointer';
            } else if (hoveredMesh) {
                document.body.style.cursor = 'pointer';
                store.unhoverNotification();
            } else {
                document.body.style.cursor = 'default';
                store.unhoverNotification();
            }
        });

        window.addEventListener('click', (event) => {
            if (store.isModalOpen) return;
            if (event.target.closest('.notif-card')) return; // handled by card listener
            if (event.target.closest('.modal-backdrop')) return;

            const hoveredAnchor = getHoveredAnchor(event);
            if (hoveredAnchor) {
                const notif = store.notifications.find(n => n.anchorId === hoveredAnchor);
                if (notif) handleCardClick(notif.id);
            }
        });

        // Keyboard navigation
        window.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                if (store.isModalOpen) {
                    closeModal();
                }
            }
            if (event.key === 'Tab' && store.isModalOpen) {
                event.preventDefault();
                // Trap focus in modal
            }
        });

        // ==================== RENDER LOOP ====================
        const clock = new THREE.Clock();
        let frameCount = 0;
        let lastOverlayUpdate = 0;
        const OVERLAY_UPDATE_INTERVAL = 1 / 30; // Update overlays at 30fps

        function animate(timestamp) {
            requestAnimationFrame(animate);

            const dt = Math.min(clock.getDelta(), 0.1);
            const now = timestamp / 1000;
            frameCount++;

            controls.update();

            // Idle camera float (when no animation active)
            if (!cameraAnimTarget) {
                const floatX = Math.sin(now * CAMERA_CONFIG.idleFloatFrequency) * CAMERA_CONFIG.idleFloatAmplitude;
                const floatY = Math.cos(now * CAMERA_CONFIG.idleFloatFrequency * 1.3) * CAMERA_CONFIG.idleFloatAmplitude *
                    0.7;
                const baseTarget = store.buildingCenter.clone();
                controls.target.lerp(
                    new THREE.Vector3(baseTarget.x + floatX, baseTarget.y + floatY, baseTarget.z),
                    0.02
                );
                resetCameraAnimation();
            } else {
                updateCameraAnimation(now);
            }

            // Animate particles
            if (particles && particles.userData.phases) {
                const phases = particles.userData.phases;
                const posArray = particles.geometry.attributes.position.array;
                for (let i = 0; i < particlesCount; i++) {
                    const i3 = i * 3;
                    const baseY = posArray[i3 + 1];
                    const floatOffset = Math.sin(now * 0.7 + phases[i]) * 0.15;
                    posArray[i3 + 1] = baseY + floatOffset;
                }
                particles.geometry.attributes.position.needsUpdate = true;
                // Subtle rotation
                particles.rotation.y += dt * 0.03;
            }

            // Update overlays at reduced rate
            if (now - lastOverlayUpdate > OVERLAY_UPDATE_INTERVAL) {
                lastOverlayUpdate = now;
                updateAllOverlays();
            }

            // Render
            composer.render();
        }

        // ==================== INITIALIZATION ====================
        async function init() {
            console.log('🏛️ Mesori - 3D Notification Scene');
            console.log('📋 Loading building model...');

            await loadBuildingModel();

            // Hide loading screen
            setTimeout(() => {
                loadingScreen.classList.add('hidden');
                setTimeout(() => loadingScreen.remove(), 600);
            }, 400);

            // Initialize overlay positions
            updateAllOverlays();

            // Start render loop
            requestAnimationFrame(animate);

            console.log('✅ Mesori initialized successfully.');
            console.log(`📬 ${store.notifications.length} notifications loaded.`);
            console.log(`📍 ${Object.keys(anchorObjects).length} anchors available.`);
        }

        // ==================== START ====================
        init().catch((error) => {
            console.error('Failed to initialize:', error);
            loadingScreen.querySelector('.loading-text').textContent = 'FAILED TO LOAD - CHECK CONSOLE';
            loadingScreen.querySelector('.loading-ring').style.borderTopColor = '#ff4444';
        });

        // ==================== EXPORT FOR DEBUG ====================
        window.__MESORI__ = {
            store,
            scene,
            camera,
            controls,
            anchorObjects,
            buildingModel,
            allBuildingMeshes,
            worldToScreen,
            addNotification: (notif) => {
                store.addNotification(notif);
                updateAllOverlays();
            },
            removeNotification: (id) => {
                store.removeNotification(id);
                updateAllOverlays();
            },
            getAnchorPositions: () => {
                const positions = {};
                Object.entries(anchorObjects).forEach(([id, obj]) => {
                    const wp = new THREE.Vector3();
                    obj.getWorldPosition(wp);
                    positions[id] = wp;
                });
                return positions;
            },
        };

        console.log('🔧 Debug API available at window.__MESORI__');
        console.log('  __MESORI__.store - notification store');
        console.log('  __MESORI__.addNotification(notif) - add a notification');
        console.log('  __MESORI__.removeNotification(id) - remove a notification');
        console.log('  __MESORI__.getAnchorPositions() - get all anchor world positions');
    </script>
</body>
</html>
