<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mesori · 3D Notifications</title>
  <style>
    /* ========== MOBILE FIRST BASE (320px+) ========== */
    :root {
      --gold: #c8963e;
      --gold-light: #e0c878;
      --text-primary: #f0e6d3;
      --text-secondary: #b8a88a;
      --card-bg: rgba(14, 18, 30, 0.8);
      --card-border: rgba(200, 150, 62, 0.35);
      --unread-dot: #ff6b35;
      --card-width: clamp(180px, 45vw, 220px);
      --card-padding: 10px;
      --avatar-size: 32px;
      --font-size-title: 0.8rem;
      --font-size-meta: 0.7rem;
      --font-size-badge: 0.6rem;
      --glow-blur: 20px;
      --touch-target: 48px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #060a10;
      font-family: 'Cinzel', Georgia, 'Times New Roman', serif;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      cursor: default;
      display: flex;
      flex-direction: column;
    }

    #root {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    canvas {
      display: block;
      position: absolute;
      inset: 0;
    }

    /* --- Notification overlay container (mobile: stacked at bottom) --- */
    #notification-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 20;
      pointer-events: none;
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      padding: 10px 10px env(safe-area-inset-bottom, 10px);
      gap: 10px;
      max-height: 55%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      mask-image: linear-gradient(to bottom, transparent, black 20%);
      -webkit-mask-image: linear-gradient(to bottom, transparent, black 20%);
    }

    /* --- Individual card --- */
    .notif-card {
      pointer-events: auto;
      width: var(--card-width);
      padding: var(--card-padding);
      border-radius: 14px;
      background: var(--card-bg);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      border: 1.5px solid var(--card-border);
      box-shadow: 0 4px 25px rgba(0,0,0,0.6), 0 0 0 1px rgba(200,150,62,0.15) inset;
      transition: transform 0.3s ease, border-color 0.3s, box-shadow 0.3s, opacity 0.3s;
      cursor: pointer;
      color: var(--text-primary);
      touch-action: manipulation;
      min-height: var(--touch-target);
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative; /* for positioning in desktop later */
      will-change: transform;
    }

    .notif-card:active {
      transform: scale(0.97);
      transition: transform 0.1s;
    }

    .notif-card.unread {
      border-left: 3px solid var(--unread-dot);
      box-shadow: 0 4px 25px rgba(0,0,0,0.6), 0 0 30px rgba(255,107,53,0.15);
    }

    .notif-card.urgent {
      border-color: rgba(255,80,40,0.55);
      animation: urgentPulse 2.5s ease-in-out infinite;
    }

    @keyframes urgentPulse {
      0%, 100% { box-shadow: 0 4px 25px rgba(0,0,0,0.6), 0 0 25px rgba(255,80,40,0.1); }
      50% { box-shadow: 0 4px 25px rgba(0,0,0,0.6), 0 0 50px rgba(255,80,40,0.25); }
    }

    .notif-card.occluded {
      opacity: 0.25;
      pointer-events: none;
    }

    .notif-card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .notif-avatar {
      width: var(--avatar-size);
      height: var(--avatar-size);
      border-radius: 50%;
      flex-shrink: 0;
      border: 2px solid rgba(200,150,62,0.5);
      background: linear-gradient(135deg, #1a1410, #2a1f14);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: calc(var(--avatar-size) * 0.45);
      color: var(--gold-light);
    }

    .notif-meta {
      flex: 1;
      min-width: 0;
    }
    .notif-username {
      font-size: var(--font-size-meta);
      font-weight: 700;
      letter-spacing: 0.4px;
      color: var(--gold-light);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .notif-time {
      font-size: calc(var(--font-size-meta) * 0.8);
      color: var(--text-secondary);
    }

    .notif-title {
      font-size: var(--font-size-title);
      line-height: 1.3;
      color: var(--text-primary);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 4px;
    }

    .notif-badge {
      display: inline-block;
      font-size: var(--font-size-badge);
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 2px 8px;
      border-radius: 20px;
      text-transform: uppercase;
      background: rgba(200,150,62,0.2);
      color: var(--gold-light);
      border: 1px solid rgba(200,150,62,0.3);
      align-self: flex-start;
    }
    .notif-badge.quest { background: rgba(255,180,60,0.2); border-color: rgba(255,180,60,0.4); color: #ffb83c; }
    .notif-badge.reward { background: rgba(100,220,140,0.18); border-color: rgba(100,220,140,0.35); color: #64dc8c; }
    .notif-badge.event { background: rgba(180,130,255,0.18); border-color: rgba(180,130,255,0.35); color: #b482ff; }
    .notif-badge.system { background: rgba(150,170,200,0.18); border-color: rgba(150,170,200,0.3); color: #96aac8; }

    /* Connector lines (SVG) - hidden on very small screens to save clutter */
    .connector-line {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 15;
      opacity: 0.4;
    }
    .connector-line path {
      fill: none;
      stroke: url(#goldGradient);
      stroke-width: 1.5;
      stroke-dasharray: 5 6;
      stroke-dashoffset: 0;
      animation: dashFlow 2s linear infinite;
      filter: drop-shadow(0 0 4px rgba(220,160,50,0.6));
    }
    @keyframes dashFlow { to { stroke-dashoffset: -22; } }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(5px);
      z-index: 200;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: env(safe-area-inset-bottom, 20px);
    }
    .modal-content {
      background: rgba(16,22,36,0.95);
      backdrop-filter: blur(20px);
      border: 1.5px solid rgba(200,150,62,0.45);
      border-radius: 20px 20px 0 0;
      padding: 24px 20px;
      width: 100%;
      max-width: 500px;
      color: var(--text-primary);
      box-shadow: 0 -10px 40px rgba(0,0,0,0.7);
      animation: modalSlideUp 0.35s ease;
    }
    @keyframes modalSlideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-close {
      float: right;
      background: none;
      border: 1px solid rgba(200,150,62,0.3);
      color: var(--gold-light);
      font-size: 1.2rem;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      min-height: 44px;
      min-width: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Loading */
    .loading-screen {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: #060a10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s;
    }
    .loading-screen.hidden { opacity: 0; pointer-events: none; }
    .loading-ring {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(200,150,62,0.2);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text {
      margin-top: 16px;
      color: var(--gold-light);
      font-size: 0.9rem;
      letter-spacing: 2px;
    }

    /* ========== TABLET (min-width: 600px) ========== */
    @media (min-width: 600px) {
      :root {
        --card-width: 240px;
        --card-padding: 12px;
        --avatar-size: 36px;
        --font-size-title: 0.85rem;
        --font-size-meta: 0.75rem;
        --font-size-badge: 0.65rem;
      }
      #notification-overlay {
        position: absolute;
        bottom: auto;
        inset: 0;
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-start;
        padding: 20px;
        max-height: 100%;
        overflow: visible;
        mask-image: none;
        -webkit-mask-image: none;
      }
      .notif-card {
        position: absolute; /* will be positioned by JS */
        top: 0;
        left: 0;
        box-shadow: 0 8px 30px rgba(0,0,0,0.7), 0 0 0 1px rgba(200,150,62,0.15) inset;
      }
      .connector-line {
        opacity: 0.7;
      }
      .modal-content {
        border-radius: 20px;
        margin-bottom: 40px;
      }
      .modal-backdrop {
        align-items: center;
      }
    }

    /* ========== DESKTOP (min-width: 1024px) ========== */
    @media (min-width: 1024px) {
      :root {
        --card-width: 280px;
        --card-padding: 16px;
        --avatar-size: 42px;
        --font-size-title: 0.95rem;
        --font-size-meta: 0.8rem;
        --font-size-badge: 0.7rem;
      }
      .notif-card:hover {
        border-color: rgba(220,170,70,0.7);
        box-shadow: 0 12px 40px rgba(0,0,0,0.7), 0 0 0 1px rgba(220,170,70,0.3) inset, 0 0 50px rgba(200,150,62,0.2);
        transform: translate(var(--float-x, 0), var(--float-y, 0)) scale(1.03);
      }
    }

    /* reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .notif-card, .connector-line path, .modal-content, .loading-ring {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root">
    <div class="loading-screen" id="loading-screen">
      <div class="loading-ring"></div>
      <div class="loading-text">ENTERING MESORI</div>
    </div>
  </div>

  <svg style="position:absolute;width:0;height:0;" aria-hidden="true">
    <defs>
      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#c8963e" stop-opacity="0.9"/><stop offset="50%" stop-color="#f0d78c" stop-opacity="1"/><stop offset="100%" stop-color="#c8963e" stop-opacity="0.9"/>
      </linearGradient>
      <radialGradient id="glowDot" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#f0d78c" stop-opacity="1"/><stop offset="60%" stop-color="#c8963e" stop-opacity="0.5"/><stop offset="100%" stop-color="#c8963e" stop-opacity="0"/>
      </radialGradient>
      <filter id="glowFilter" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="2.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
  </svg>

  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { SSAOPass } from 'three/addons/postprocessing/SSAOPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
    import { RGBShiftShader } from 'three/addons/shaders/RGBShiftShader.js';
    import { AfterimagePass } from 'three/addons/postprocessing/AfterimagePass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    // ---------- CONSTANTS ----------
    const MODEL_PATH = './egyptian_stone_masons_shop.glb';
    const ANCHOR_NAMES = ['Notification_1','Notification_2','Notification_3','Notification_4','Notification_5','Notification_6','Notification_7','Notification_8'];
    const FALLBACK_OFFSETS = [
      {x:3.5,y:0.8,z:0},{x:2.5,y:1.5,z:2.5},{x:0,y:2.0,z:3.5},{x:-2.5,y:1.5,z:2.5},
      {x:-3.5,y:0.8,z:0},{x:-2.5,y:0.3,z:-2.5},{x:0,y:-0.2,z:-3.5},{x:2.5,y:0.3,z:-2.5}
    ];

    // ---------- DOM ----------
    const rootDiv = document.getElementById('root');
    const loadingEl = document.getElementById('loading-screen');
    const overlay = document.createElement('div');
    overlay.id = 'notification-overlay';
    rootDiv.appendChild(overlay);

    const svgConnector = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svgConnector.classList.add('connector-line');
    overlay.appendChild(svgConnector);

    // ---------- STATE ----------
    const store = {
      notifications: [],
      selectedId: null,
      hoveredId: null,
      modalOpen: false,
      anchorPositions: {},
      buildingCenter: new THREE.Vector3(0,0.8,0),
      boundingSphere: new THREE.Sphere(new THREE.Vector3(0,0.8,0),2.2),
      select(id){ this.selectedId=id; this.modalOpen=true; },
      close(){ this.modalOpen=false; this.selectedId=null; },
      markRead(id){ const n=this.notifications.find(n=>n.id===id); if(n)n.read=true; },
      remove(id){ this.notifications=this.notifications.filter(n=>n.id!==id); if(this.selectedId===id)this.close(); },
      add(n){ this.notifications.unshift(n); },
      getSelected(){ return this.notifications.find(n=>n.id===this.selectedId)||null; }
    };

    // Sample data
    function createSampleNotifications() {
      const now = Date.now();
      return [
        {id:'n1',anchorId:'Notification_1',title:'Pharaoh\'s Commission Ready',message:'Grand obelisk approved. Delivery at dawn.',initials:'RA',username:'Royal Architect',timestamp:now-480000,type:'quest',priority:'high',read:false},
        {id:'n2',anchorId:'Notification_2',title:'Granite Shipment Arrived',message:'12 Aswan blocks delivered.',initials:'MS',username:'Master Stonemason',timestamp:now-1500000,type:'system',priority:'medium',read:false},
        {id:'n3',anchorId:'Notification_3',title:'Temple Column Milestone',message:'Column #7 complete. +150 Reputation.',initials:'HP',username:'High Priest',timestamp:now-2700000,type:'reward',priority:'medium',read:true},
        {id:'n4',anchorId:'Notification_4',title:'Urgent: Royal Inspection',message:'Pharaoh arrives in 2 days. Cover unfinished works.',initials:'VC',username:'Vizier\'s Courier',timestamp:now-720000,type:'event',priority:'urgent',read:false},
        {id:'n5',anchorId:'Notification_5',title:'Apprentice Leveled Up',message:'Khenemet achieved Journeyman carver.',initials:'KH',username:'Khenemet',timestamp:now-5400000,type:'reward',priority:'low',read:true},
        {id:'n6',anchorId:'Notification_6',title:'Limestone Quarry Depleted',message:'Switch to sandstone for minor works.',initials:'QS',username:'Quarry Supervisor',timestamp:now-9000000,type:'system',priority:'medium',read:true},
        {id:'n7',anchorId:'Notification_7',title:'Festival of Opet',message:'All craftsmen invited. Bonus rest day.',initials:'TF',username:'Temple Herald',timestamp:now-12000000,type:'event',priority:'low',read:true},
        {id:'n8',anchorId:'Notification_8',title:'Tools Sharpened',message:'Copper chisels returned from smithy.',initials:'BS',username:'Bronze Smith',timestamp:now-18000000,type:'system',priority:'low',read:true}
      ];
    }
    store.notifications = createSampleNotifications();

    // ---------- THREE.JS SETUP ----------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#060a10');
    scene.fog = new THREE.FogExp2('#060a10',0.00025);

    const camera = new THREE.PerspectiveCamera(50,2,0.5,40);
    camera.position.set(4.5,3.2,6.5);
    camera.lookAt(store.buildingCenter);

    const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    renderer.setSize(window.innerWidth,window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    rootDiv.appendChild(renderer.domElement);

    // Composer
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene,camera));
    const ssao = new SSAOPass(scene,camera,window.innerWidth,window.innerHeight);
    ssao.kernelRadius=0.5; ssao.ssaoIntensity=0.5; composer.addPass(ssao);
    const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth,window.innerHeight),0.5,0.4,0.85);
    composer.addPass(bloom);
    const rgbShift = new ShaderPass(RGBShiftShader); rgbShift.uniforms['amount'].value=0.0012; composer.addPass(rgbShift);
    composer.addPass(new AfterimagePass(0.15));
    composer.addPass(new OutputPass());

    // Lighting
    scene.add(new THREE.AmbientLight('#2a3050',0.7));
    scene.add(new THREE.HemisphereLight('#8899cc','#3a2210',0.5));
    const sun = new THREE.DirectionalLight('#fff5e8',4.5);
    sun.position.set(8,10,3); sun.castShadow=true;
    sun.shadow.mapSize.set(2048,2048); sun.shadow.camera.near=0.5; sun.shadow.camera.far=50;
    sun.shadow.camera.left=-10; sun.shadow.camera.right=10; sun.shadow.camera.top=10; sun.shadow.camera.bottom=-10;
    scene.add(sun);
    scene.add(new THREE.DirectionalLight('#aaccff',2.0).position.set(-3,2,-4));
    scene.add(new THREE.DirectionalLight('#ffcc88',1.8).position.set(0,1.5,5));
    scene.add(new THREE.DirectionalLight('#886633',1.2).position.set(0,-0.5,0));

    // Ground
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshStandardMaterial({color:'#1a1510',roughness:0.85}));
    ground.rotation.x=-Math.PI/2; ground.position.y=-2.2; ground.receiveShadow=true; scene.add(ground);

    // Particles (reduced on mobile via JS)
    const particleCount = window.innerWidth < 600 ? 200 : 600;
    const pGeo = new THREE.BufferGeometry();
    const pPos = new Float32Array(particleCount*3);
    const pPhases = new Float32Array(particleCount);
    for(let i=0;i<particleCount;i++){
      const theta=Math.random()*Math.PI*2, phi=Math.random()*Math.PI*0.7, r=3+Math.random()*6;
      pPos[i*3]=Math.cos(theta)*Math.cos(phi)*r;
      pPos[i*3+1]=Math.sin(phi)*r+0.5;
      pPos[i*3+2]=Math.sin(theta)*Math.cos(phi)*r;
      pPhases[i]=Math.random()*Math.PI*2;
    }
    pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
    const particles = new THREE.Points(pGeo,new THREE.PointsMaterial({color:'#e0c878',size:0.025,blending:THREE.AdditiveBlending,depthWrite:false,opacity:0.5}));
    particles.userData.phases=pPhases; scene.add(particles);

    // Controls
    const controls = new OrbitControls(camera,renderer.domElement);
    controls.target.copy(store.buildingCenter);
    controls.minDistance=3.5; controls.maxDistance=10;
    controls.minPolarAngle=Math.PI*0.25; controls.maxPolarAngle=Math.PI*0.65;
    controls.enableDamping=true; controls.dampingFactor=0.08;
    controls.autoRotate=true; controls.autoRotateSpeed=0.15; controls.enablePan=false;
    controls.update();

    // ---------- MODEL LOADING ----------
    const anchorObjects = {};
    const allMeshes = [];
    let buildingModel = null;

    function processModel(gltfScene){
      gltfScene.traverse(child=>{
        if(ANCHOR_NAMES.includes(child.name)) anchorObjects[child.name]=child;
        if(child.isMesh){ allMeshes.push(child); child.castShadow=true; child.receiveShadow=true; }
      });
      if(Object.keys(anchorObjects).length===0){
        console.warn('No anchors found in GLB, creating fallback empties.');
        FALLBACK_OFFSETS.forEach((off,i)=>{
          const empty = new THREE.Object3D(); empty.name=ANCHOR_NAMES[i]; empty.position.set(off.x,off.y,off.z);
          gltfScene.add(empty); anchorObjects[ANCHOR_NAMES[i]]=empty;
        });
      }
      return gltfScene;
    }

    function computeSphere(model){
      const box=new THREE.Box3().setFromObject(model);
      const sphere=new THREE.Sphere(); box.getBoundingSphere(sphere);
      sphere.radius*=0.85; return sphere;
    }

    const dracoLoader = new DRACOLoader().setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/draco/');
    const gltfLoader = new GLTFLoader().setDRACOLoader(dracoLoader);

    async function loadModel(){
      try{
        const gltf = await gltfLoader.loadAsync(MODEL_PATH, p=>{
          loadingEl.querySelector('.loading-text').textContent = `LOADING ${Math.round(p.loaded/p.total*100)}%`;
        });
        buildingModel = processModel(gltf.scene);
        scene.add(buildingModel);
        store.boundingSphere = computeSphere(buildingModel);
        store.buildingCenter.copy(store.boundingSphere.center);
        controls.target.copy(store.buildingCenter);
        console.log('✅ Model loaded, anchors:',Object.keys(anchorObjects).length);
      }catch(e){
        console.warn('Model load failed, using placeholder.',e);
        buildingModel = new THREE.Group();
        buildingModel.name='building';
        const body = new THREE.Mesh(new THREE.BoxGeometry(2,2.5,2),new THREE.MeshStandardMaterial({color:'#c8b896',roughness:0.6}));
        body.position.y=1.25; body.castShadow=true; buildingModel.add(body); allMeshes.push(body);
        for(let i=0;i<8;i++){
          const off=FALLBACK_OFFSETS[i]; const empty=new THREE.Object3D(); empty.name=ANCHOR_NAMES[i]; empty.position.set(off.x,off.y,off.z);
          buildingModel.add(empty); anchorObjects[ANCHOR_NAMES[i]]=empty;
        }
        scene.add(buildingModel);
        store.boundingSphere = computeSphere(buildingModel);
        store.buildingCenter.copy(store.boundingSphere.center);
        controls.target.copy(store.buildingCenter);
      }
      loadingEl.classList.add('hidden');
      setTimeout(()=>loadingEl.remove(),600);
    }

    // ---------- WORLD TO SCREEN ----------
    const _v3 = new THREE.Vector3();
    function worldToScreen(worldPos){
      _v3.copy(worldPos).project(camera);
      return {
        x:(_v3.x*0.5+0.5)*window.innerWidth,
        y:(-_v3.y*0.5+0.5)*window.innerHeight,
        visible:_v3.z<1&&_v3.z>0
      };
    }

    // ---------- OVERLAY MANAGEMENT ----------
    const cardEls = {};
    function formatTime(ts){ const d=Date.now()-ts; if(d<6e4)return 'now'; if(d<36e5)return Math.floor(d/6e4)+'m'; if(d<864e5)return Math.floor(d/36e5)+'h'; return Math.floor(d/864e5)+'d'; }

    function createCard(notif){
      if(cardEls[notif.id]) return cardEls[notif.id];
      const card = document.createElement('div');
      card.className = 'notif-card'+(notif.read?'':' unread')+(notif.priority==='urgent'?' urgent':'');
      card.dataset.id = notif.id;
      card.innerHTML = `
        <div class="notif-card-header">
          <div class="notif-avatar">${notif.initials}</div>
          <div class="notif-meta"><div class="notif-username">${notif.username}</div><div class="notif-time">${formatTime(notif.timestamp)}</div></div>
        </div>
        <div class="notif-title">${notif.title}</div>
        <span class="notif-badge ${notif.type}">${notif.type}</span>`;
      card.addEventListener('click',(e)=>{ e.stopPropagation(); openNotification(notif.id); });
      card.addEventListener('touchstart',()=>{}, {passive:true});
      overlay.appendChild(card);
      cardEls[notif.id]=card;
      return card;
    }

    function removeCard(id){
      const el=cardEls[id]; if(!el)return;
      el.style.opacity='0'; el.style.transform='scale(0.9)';
      setTimeout(()=>{ el.remove(); delete cardEls[id]; },300);
    }

    function updateOverlayPositions(){
      const isMobile = window.innerWidth < 600;
      svgConnector.innerHTML = '';
      const buildingScreen = worldToScreen(store.buildingCenter);
      const cx = buildingScreen?.x??window.innerWidth/2, cy = buildingScreen?.y??window.innerHeight*0.4;

      store.notifications.forEach(n=>{
        const anchor = anchorObjects[n.anchorId]; if(!anchor) return;
        const worldPos = anchor.getWorldPosition(new THREE.Vector3());
        store.anchorPositions[n.anchorId] = worldPos.clone();
        const screen = worldToScreen(worldPos);
        if(!screen?.visible){ const el=cardEls[n.id]; if(el)el.style.display='none'; return; }

        const card = createCard(n);
        card.style.display = '';

        if(isMobile){
          card.style.position = 'relative';
          card.style.left = card.style.top = 'auto';
          card.style.transform = 'none';
        } else {
          card.style.position = 'absolute';
          const floatX = Math.sin(performance.now()*0.001+n.id.charCodeAt(0))*4;
          const floatY = Math.cos(performance.now()*0.0013+n.id.charCodeAt(1))*4;
          card.style.left = (screen.x - card.offsetWidth/2 + floatX)+'px';
          card.style.top = (screen.y - card.offsetHeight/2 + floatY)+'px';
          card.style.setProperty('--float-x',floatX+'px'); card.style.setProperty('--float-y',floatY+'px');
        }

        // Connector line
        if(!isMobile){
          const path = document.createElementNS('http://www.w3.org/2000/svg','path');
          const mx=(cx+screen.x)/2, my=Math.min(cy,screen.y)-25;
          path.setAttribute('d',`M${cx},${cy} Q${mx},${my} ${screen.x},${screen.y}`);
          svgConnector.appendChild(path);
        }
      });

      // Remove stale cards
      const ids = new Set(store.notifications.map(n=>n.id));
      Object.keys(cardEls).forEach(id=>{ if(!ids.has(id)) removeCard(id); });
    }

    // ---------- MODAL ----------
    let modalEl = null;
    function openNotification(id){
      const notif = store.notifications.find(n=>n.id===id); if(!notif)return;
      store.select(id); store.markRead(id);
      const card = cardEls[id]; if(card) card.classList.remove('unread');
      if(modalEl) modalEl.remove();
      modalEl = document.createElement('div'); modalEl.className='modal-backdrop';
      modalEl.innerHTML = `
        <div class="modal-content">
          <button class="modal-close">✕</button>
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
            <div class="notif-avatar" style="width:44px;height:44px;font-size:1.1rem;">${notif.initials}</div>
            <div><strong style="color:var(--gold-light)">${notif.username}</strong><br><small style="color:var(--text-secondary)">${formatTime(notif.timestamp)}</small></div>
          </div>
          <h3 style="margin-bottom:8px;">${notif.title}</h3>
          <p style="color:var(--text-secondary);line-height:1.5;">${notif.message}</p>
          <span class="notif-badge ${notif.type}" style="margin-top:10px;">${notif.type} · ${notif.priority}</span>
          <div style="margin-top:16px;display:flex;gap:10px;justify-content:flex-end;">
            <button class="modal-close" style="float:none;">Close</button>
          </div>`;
      modalEl.querySelectorAll('.modal-close').forEach(b=>b.addEventListener('click',closeModal));
      modalEl.addEventListener('click',(e)=>{ if(e.target===modalEl) closeModal(); });
      document.body.appendChild(modalEl);
    }

    function closeModal(){
      if(modalEl){ modalEl.style.opacity='0'; setTimeout(()=>{ modalEl?.remove(); modalEl=null; },250); }
      store.close();
    }

    // ---------- RAYCASTER ----------
    const raycaster = new THREE.Raycaster(); const mouse = new THREE.Vector2();
    function updateMouse(e){ mouse.x=(e.clientX/window.innerWidth)*2-1; mouse.y=-(e.clientY/window.innerHeight)*2+1; }
    function getHoveredAnchor(e){
      updateMouse(e);
      const entries = Object.entries(anchorObjects);
      for(const [id,obj] of entries){
        const wp = obj.getWorldPosition(new THREE.Vector3());
        const sp = worldToScreen(wp); if(!sp?.visible) continue;
        const dist = Math.hypot(e.clientX-sp.x, e.clientY-sp.y);
        if(dist<35) return id;
      }
      return null;
    }

    // ---------- EVENTS ----------
    window.addEventListener('resize',()=>{
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth,window.innerHeight);
      composer.setSize(window.innerWidth,window.innerHeight);
      updateOverlayPositions();
    });

    window.addEventListener('mousemove',(e)=>{
      if(store.modalOpen) return;
      const anchorId = getHoveredAnchor(e);
      store.hoveredId = anchorId ? store.notifications.find(n=>n.anchorId===anchorId)?.id : null;
      document.body.style.cursor = anchorId ? 'pointer' : 'default';
    });

    window.addEventListener('click',(e)=>{
      if(store.modalOpen || e.target.closest('.notif-card')) return;
      const anchorId = getHoveredAnchor(e);
      if(anchorId){ const n = store.notifications.find(n=>n.anchorId===anchorId); if(n) openNotification(n.id); }
    });

    window.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

    // ---------- ANIMATION LOOP ----------
    let lastOverlayUpdate=0;
    function animate(time){
      requestAnimationFrame(animate);
      controls.update();
      if(particles){
        const arr = particles.geometry.attributes.position.array;
        const phases = particles.userData.phases;
        for(let i=0;i<particleCount;i++) arr[i*3+1] += Math.sin(time*0.001+phases[i])*0.0005;
        particles.geometry.attributes.position.needsUpdate=true;
      }
      if(time-lastOverlayUpdate>100){
        lastOverlayUpdate=time;
        updateOverlayPositions();
      }
      composer.render();
    }

    // ---------- START ----------
    loadModel().then(()=>{
      updateOverlayPositions();
      requestAnimationFrame(animate);
    });
  </script>
</body>
</html>
